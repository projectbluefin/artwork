name: Build and Publish Wallpapers

on:
  push:
    branches:
      - main
    paths:
      - 'wallpapers/**'
      - 'package-gnome-wallpapers.sh'
      - 'Containerfile'
      - '.github/workflows/build-and-publish-wallpapers.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: bluefin-wallpapers-gnome
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Package GNOME wallpapers
        run: |
          ./package-gnome-wallpapers.sh dist/gnome

      - name: Verify package contents
        run: |
          COUNT=$(find dist/gnome -type f | wc -l)
          test "$COUNT" -eq 60 || { echo "Expected 60 files, found $COUNT"; exit 1; }
          for i in $(seq -w 1 12); do
            test -f "dist/gnome/${i}-bluefin.xml" || { echo "Missing ${i}-bluefin.xml"; exit 1; }
            test -f "dist/gnome/gnome-background-properties/${i}-bluefin.xml" || { echo "Missing properties for ${i}"; exit 1; }
          done
          test -f "dist/gnome/11-bluefin-day.svg" || { echo "Missing 11-bluefin-day.svg"; exit 1; }
          test -f "dist/gnome/11-bluefin-night.svg" || { echo "Missing 11-bluefin-night.svg"; exit 1; }
          test -f "dist/gnome/chicken.jxl" || { echo "Missing chicken.jxl"; exit 1; }
          echo "All wallpaper verification checks passed (60/60 files verified)."

      - name: Build image with Podman
        run: |
          sudo podman build \
            --platform "linux/${{ matrix.platform }}" \
            --file ./Containerfile \
            --tag "${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.platform }}" \
            .

      - name: Push per-arch image to GHCR
        if: github.event_name != 'pull_request'
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: "${{ github.sha }}-${{ matrix.platform }}"
          compression-format: gzip
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save per-arch digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.push.outputs.digest }}" > "/tmp/digests/${{ matrix.platform }}.txt"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.platform }}
          path: /tmp/digests/${{ matrix.platform }}.txt

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Read per-arch digests
        id: digests
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/amd64.txt)
          ARM64_DIGEST=$(cat /tmp/digests/arm64.txt)
          test -n "${AMD64_DIGEST}" || { echo "Missing amd64 digest"; exit 1; }
          test -n "${ARM64_DIGEST}" || { echo "Missing arm64 digest"; exit 1; }
          echo "amd64=${AMD64_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "arm64=${ARM64_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        run: |
          DATE_TAG="v$(date -u +%Y%m%d)"
          SHA_TAG="${GITHUB_SHA::7}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        id: manifest
        uses: projectbluefin/actions/bootc-build/create-manifest@v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: |
            latest
            ${{ steps.meta.outputs.date_tag }}
            ${{ steps.meta.outputs.sha_tag }}
          digests-json: >-
            {
              "amd64": "${{ steps.digests.outputs.amd64 }}",
              "arm64": "${{ steps.digests.outputs.arm64 }}"
            }
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and publish multi-arch image
        uses: projectbluefin/actions/bootc-build/sign-and-publish@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.manifest.outputs.digest }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          certificate-identity-regexp: "https://github.com/projectbluefin/artwork/.github/workflows/"
          generate-sbom: "false"
